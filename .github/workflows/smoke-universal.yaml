name: Smoke test "universal" build

on: 
  workflow_dispatch:
  push:
    branches:
    - main
  pull_request:
    paths:
      - src/universal/**
      - .github/workflows/smoke-universal.yaml
      - .github/actions/**
      - build/**
jobs:
  smoke-test:
    name: Smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
    # These large images need the disk occupied by unused hosted-runner SDKs.
    - name: Prepare disk for large image
      run: |
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
        docker image prune --all --force
        df -h /

    - name: Checkout
      id: checkout
      uses: actions/checkout@v6
    - name: Smoke test
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      id: smoke_test
      uses: ./.github/actions/smoke-test
      with:
        image: universal
        threshold: 10
